name: Vider ou remplacer le dépôt

# Lancement manuel : onglet « Actions » > « Vider ou remplacer le dépôt » > « Run workflow ».
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez SUPPRIMER (en majuscules) pour confirmer"
        required: true
        type: string
      zip_file:
        description: "Facultatif : nom d'un ZIP déjà envoyé à la racine du dépôt (ex. gestionsco-sans-lovable.zip). Il sera décompressé après le nettoyage."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: remplacer-depot
  cancel-in-progress: false

jobs:
  remplacer:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "SUPPRIMER" ]; then
            echo "::error::Confirmation incorrecte : tapez exactement SUPPRIMER."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Préparer le ZIP (avant toute suppression)
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/nouveau"
          if [ -n "$ZIP_FILE" ]; then
            case "$ZIP_FILE" in */*|*..*) echo "::error::Donnez seulement le nom du fichier, sans dossier."; exit 1;; esac
            if [ ! -f "$ZIP_FILE" ]; then
              echo "::error::Le fichier '$ZIP_FILE' est introuvable à la racine du dépôt. Rien n'a été supprimé."
              exit 1
            fi
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/zip"
            # Si le ZIP contient un seul dossier, on prend son contenu
            n=$(find "$RUNNER_TEMP/zip" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$n" -eq 1 ] && [ -d "$(find "$RUNNER_TEMP/zip" -mindepth 1 -maxdepth 1)" ]; then
              cp -a "$(find "$RUNNER_TEMP/zip" -mindepth 1 -maxdepth 1)/." "$RUNNER_TEMP/nouveau/"
            else
              cp -a "$RUNNER_TEMP/zip/." "$RUNNER_TEMP/nouveau/"
            fi
            rm -rf "$RUNNER_TEMP/nouveau/.git" "$RUNNER_TEMP/nouveau/.github"
            echo "Contenu du ZIP prêt : $(find "$RUNNER_TEMP/nouveau" -type f | wc -l) fichiers."
          fi

      - name: Supprimer tous les fichiers (sauf .git et .github)
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          ls -A

      - name: Copier les nouveaux fichiers (si un ZIP a été donné)
        run: |
          if [ -n "$(ls -A "$RUNNER_TEMP/nouveau")" ]; then
            cp -a "$RUNNER_TEMP/nouveau/." .
          fi

      - name: Enregistrer et envoyer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Remplacement du contenu du dépôt"
            git push
          fi

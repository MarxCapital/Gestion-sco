name: Décompresser le zip
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser tous les fichiers .zip à la racine
        run: |
          shopt -s nullglob nocaseglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Aucun fichier .zip à la racine."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Décompression de : $z"
            unzip -o -q "$z" -d .
            rm -f -- "$z"
          done
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Ajout des fichiers depuis le zip" || echo "Rien à ajouter"
          git push

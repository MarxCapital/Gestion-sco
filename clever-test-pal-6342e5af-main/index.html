<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GestionSco — Gestion scolaire, examens et suivi des élèves</title>
    <meta name="description" content="GestionSco centralise les candidats, présences, notes, résultats et statistiques scolaires de la Circonscription Scolaire de Bantè.">
    <meta name="author" content="GestionSco" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- PWA: détection admin AVANT toute injection de balises pour qu'iOS Safari
         lise immédiatement le bon manifest (admin si /Marx, client sinon). -->
    <script>
      (function () {
        var path = window.location.pathname;
        var isAdmin = path.indexOf('/Marx') === 0 || path.indexOf('/admin') === 0;

        var manifestHref = isAdmin ? '/manifest-admin.json' : '/manifest-client.json';
        var themeColor = isAdmin ? '#1a1a2e' : '#1e3a5f';
        var appleTitle = isAdmin ? 'GestionSco Admin' : 'GestionSco';
        var appleIcon192 = isAdmin ? '/gestionsco-admin-2026-192.png' : '/gestionsco-logo-2026-192.png';
        var appleIcon512 = isAdmin ? '/gestionsco-admin-2026-512.png' : '/gestionsco-logo-2026-512.png';

        function add(tagName, attrs) {
          var el = document.createElement(tagName);
          for (var k in attrs) el.setAttribute(k, attrs[k]);
          document.head.appendChild(el);
        }

        add('link', { rel: 'manifest', href: manifestHref });
        add('meta', { name: 'theme-color', content: themeColor });
        add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
        add('meta', { name: 'mobile-web-app-capable', content: 'yes' });
        add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' });
        add('meta', { name: 'apple-mobile-web-app-title', content: appleTitle });
        add('link', { rel: 'apple-touch-icon', href: appleIcon192 });
        add('link', { rel: 'apple-touch-icon', sizes: '192x192', href: appleIcon192 });
        add('link', { rel: 'apple-touch-icon', sizes: '512x512', href: appleIcon512 });
      })();
    </script>
    <link rel="icon" type="image/png" href="/gestionsco-favicon-2026.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GestionSco — Gestion scolaire, examens et suivi des élèves">
    <meta property="og:description" content="Candidats, présences, notes, résultats et statistiques scolaires sur une plateforme unique.">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GestionSco — Gestion scolaire">
    <meta name="twitter:description" content="Candidats, présences, notes, résultats et statistiques scolaires sur une plateforme unique.">
  </head>

  </body>
</html>
